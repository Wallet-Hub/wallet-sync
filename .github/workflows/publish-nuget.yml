name: Publish NuGet packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-prerelease"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed to verify the tag is on master

      - name: Verify tag is on master
        shell: bash
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on master. Aborting publish."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Wallet.Sync.slnx

      - name: Build
        run: dotnet build Wallet.Sync.slnx --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Wallet.Sync.Core
        run: dotnet pack Wallet.Sync.Core/Wallet.Sync.Core.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Wallet.Sync.Data
        run: dotnet pack Wallet.Sync.Data/Wallet.Sync.Data.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Wallet.Sync.Data.EfCore
        run: dotnet pack Wallet.Sync.Data.EfCore/Wallet.Sync.Data.EfCore.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Add GitHub Packages source
        run: dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source github --skip-duplicate
